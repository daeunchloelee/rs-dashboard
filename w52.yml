name: 52주 신고가·신저가 갱신

on:
  schedule:
    # 하루 한 번, 한국장(15:30 KST 마감)·미국장(21:00~22:00 UTC 마감, 서머타임 근사) 둘 다
    # 끝난 뒤 21:30 UTC(=다음날 06:30 KST)에 실행. 실시간이 필요 없다는 요청에 따라 이 화면은
    # RS 대시보드(rs.yml, 매시 갱신)와 별개로 훨씬 낮은 빈도로 돈다.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: w52-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    # 코스피+코스닥 전체(시총 제한 없음) + 한국 ETF 전체 + S&P500 + 미국 ETF라 RS 대시보드보다
    # 스캔 종목 수가 훨씬 많다 — 넉넉하게 시간을 잡는다.
    timeout-minutes: 240
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 52주 신고가·신저가 계산
        working-directory: rs
        run: python compute_52w.py --out ../data/w52.json

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/w52.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "52주 신고가·신저가 갱신: $(date -u +%Y-%m-%dT%H:%M)"
            # RS 대시보드(rs.yml)가 같은 시간대에 먼저 push해버리면 main이 그 사이 앞서나가서
            # 그냥 push는 "fetch first" 에러로 실패한다. rebase 후 재시도(최대 5회, 랜덤 대기)로
            # 두 워크플로우가 겹쳐도 안전하게 반영되도록 한다.
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패(다른 워크플로우와 충돌 추정) - rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep $(( (RANDOM % 10) + 5 ))
            done
          fi
